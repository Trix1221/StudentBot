<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التحقق بنجاح - بوابة مجتمع الحاسب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #050608;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e1e1e6;
            padding: 20px;
        }
        .container {
            background: rgba(20, 21, 26, 0.95);
            backdrop-filter: blur(12px);
            width: 100%; max-width: 480px;
            padding: 40px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(87, 217, 128, 0.2);
            border: 1px solid #1e4a2b;
            text-align: center;
        }
        .success-icon {
            width: 70px; height: 70px;
            background: rgba(87, 217, 128, 0.1);
            border: 2px solid #57d980;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto; font-size: 32px; color: #57d980;
            box-shadow: 0 0 20px rgba(87, 217, 128, 0.3);
        }
        h2 { font-size: 24px; color: #fff; margin-bottom: 10px; }
        p { font-size: 13px; color: #8a8f9d; line-height: 1.6; margin-bottom: 25px; }
        .btn-back {
            display: inline-block;
            background-color: #5865F2; color: white;
            text-decoration: none; padding: 12px 25px;
            font-size: 14px; font-weight: bold; border-radius: 8px;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }
        .btn-back:hover { background-color: #4752C4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h2>تم توثيق حسابك بنجاح!</h2>
        <p>تم ربط بياناتك الأكاديمية بنجاح ومنحك الرتبة المعتمدة في سيرفر الديسكورد. يمكنك الآن العودة للسيرفر والاستمتاع بالمميزات.</p>
        <a href="/" class="btn-back">العودة للرئيسية 🏠</a>
    </div>
</body>
</html>
