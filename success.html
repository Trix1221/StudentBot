<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة مجتمع الحاسب - التحقق الأمني</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #050608;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e1e1e6;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        #cyber-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.2; pointer-events: none;
        }

        .container {
            position: relative;
            background: rgba(20, 21, 26, 0.95);
            backdrop-filter: blur(12px);
            color: #f0f0f5;
            width: 100%;
            max-width: 480px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(88, 101, 242, 0.2);
            border: 1px solid #1e2230;
            text-align: center;
            z-index: 1;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0d1a12;
            color: #57d980;
            border: 1px solid #1e4a2b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 15px;
        }
        .status-dot { width: 8px; height: 8px; background-color: #57d980; border-radius: 50%; box-shadow: 0 0 8px #57d980; }

        .icon-box {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #1e2230, #12141c);
            border: 1px solid #282b38;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 15px auto;
            font-size: 26px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        h2 { font-size: 22px; color: #fff; margin-bottom: 6px; }
        p.subtitle { font-size: 12px; color: #8a8f9d; margin-bottom: 20px; line-height: 1.5; }

        .input-group { text-align: right; margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: #a0a5b5; margin-bottom: 5px; font-weight: 600; }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0d0e12;
            border: 1px solid #202330;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-group input:focus { border-color: #5865F2; box-shadow: 0 0 10px rgba(88, 101, 242, 0.3); }

        .btn-submit {
            width: 100%;
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #4752C4; box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6); }
        .btn-submit:disabled { background-color: #3b426f; cursor: not-allowed; opacity: 0.7; }

        .progress-box { display: none; margin-top: 15px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #12141c; border-radius: 10px; overflow: hidden; border: 1px solid #202330; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #5865F2, #57d980); transition: width 0.2s ease; }
        .progress-status { font-size: 11px; color: #8a8f9d; margin-top: 8px; border: 1px solid #282b38; padding: 6px; border-radius: 6px; background: #08090c; }

        .footer-text { font-size: 10px; color: #5a5e6d; margin-top: 20px; }
    </style>
</head>
<body>

    <canvas id="cyber-canvas"></canvas>

    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span>
            متصل بالسيرفر (Render Active)
        </div>

        <div class="icon-box">🔐</div>
        <h2>بوابة مجتمع الحاسب</h2>
        <p class="subtitle">الرجاء إدخال البيانات الأكاديمية للحصول على الرتبة المعتمدة في السيرفر.</p>

        <form id="verifyForm">
            <div class="input-group">
                <label>الاسم الكامل (ثلاثي على الأقل):</label>
                <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required>
            </div>

            <div class="input-group">
                <label>الرقم الأكاديمي (9 أرقام):</label>
                <input type="text" id="studentId" placeholder="4XXXXXXXX" required pattern="\d{9}">
            </div>

            <div class="input-group">
                <label>اسم المادة / الشعبة:</label>
                <input type="text" id="courseName" placeholder="مثال: أمن الشبكات" required>
            </div>

            <div class="input-group">
                <label>معرف ديسكورد (Discord ID):</label>
                <input type="text" id="discordId" placeholder="مثال: 762964253354622976" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">بدء التحقق الأمني 🚀</button>
        </form>

        <div class="progress-box" id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-status" id="progressStatus">جاري بدء الفحص... (0%)</div>
        </div>

        <div class="footer-text">بوابة مجتمع الحاسب الرسمية © 2026</div>
    </div>

    <script>
        // تأثير خلفية الـ Cyber Rain
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const networkChars = '01010101101 TCP/IP SSL/TLS ENCRYPTED PORT_3000 AES_256 CYBER_SEC FIREWALL SSH'.split(' ');
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawCyberRain() {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#57d980';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = networkChars[Math.floor(Math.random() * networkChars.length)];
                ctx.fillText(text, i * fontSize * 3.5, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawCyberRain, 50);

        // التعامل مع نموذج التوثيق
        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const courseName = document.getElementById('courseName').value.trim();
            const discordId = document.getElementById('discordId').value.trim();

            const submitBtn = document.getElementById('submitBtn');
            const progressBox = document.getElementById('progressBox');
            const progressFill = document.getElementById('progressFill');
            const progressStatus = document.getElementById('progressStatus');

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري التحقق الأمني...';
            progressBox.style.display = 'block';

            // محاكاة شريط التقدم الأمني
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                if (progress <= 90) {
                    progressFill.style.width = progress + '%';
                    if (progress < 40) {
                        progressStatus.innerText = `[فحص البيانات] جاري التحقق من الهوية... (${progress}%)`;
                    } else if (progress < 80) {
                        progressStatus.innerText = `[تشفير] إنشاء اتصال آمن بروم ديسكورد... (${progress}%)`;
                    } else {
                        progressStatus.innerText = `[المصادقة النهائة] جاري منح الصلاحيات... (${progress}%)`;
                    }
                }
            }, 150);

            try {
                // إرسال البيانات المباشر إلى سيرفر Render
                const response = await fetch('/verify-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, studentId, courseName, discordId })
                });

                const result = await response.json();
                clearInterval(interval);

                if (result.success) {
                    progressFill.style.width = '100%';
                    progressStatus.innerText = '✅ تم التوثيق بنجاح! جاري التوجيه... (100%)';
                    setTimeout(() => {
                        window.location.href = 'success.html'; // اسم صفحة النجاح
                    }, 1000);
                } else {
                    alert('❌ خطأ: ' + result.message);
                    resetButton();
                }
            } catch (error) {
                clearInterval(interval);
                alert('❌ تعذر الاتصال بالسيرفر! يرجى المحاولة مرة أخرى.');
                resetButton();
            }

            function resetButton() {
                submitBtn.disabled = false;
                submitBtn.innerText = 'بدء التحقق الأمني 🚀';
                progressBox.style.display = 'none';
                progressFill.style.width = '0%';
            }
        });
    </script>
</body>
</html>
