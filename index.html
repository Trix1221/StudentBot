<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة مجتمع الحاسب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #050608;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e1e1e6;
            overflow: hidden;
            position: relative;
        }

        #cyber-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            position: relative;
            background: rgba(20, 21, 26, 0.94);
            backdrop-filter: blur(12px);
            color: #f0f0f5;
            width: 100%;
            max-width: 460px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(88, 101, 242, 0.2);
            border: 1px solid #282b3c;
            text-align: center;
            overflow: hidden;
            z-index: 1;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0e12;
            border: 1px solid #202330;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 18px;
            color: #8a8f9d;
        }
        .server-status { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #57d980; }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #57d980;
            border-radius: 50%;
            box-shadow: 0 0 8px #57d980;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px #57d980; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .scan-btn {
            background: #1a1c24;
            border: 1px solid #363a4e;
            color: #5865F2;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .scan-btn:hover { background: #5865F2; color: #fff; }

        .lock-icon-box {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #1e202b, #121318);
            border: 1px solid #363a4e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px auto;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .title-wrapper {
            min-height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
        }
        h2 { 
            font-size: 20px; 
            color: #ffffff; 
            letter-spacing: 0.5px;
            display: inline;
        }
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #5865F2;
            margin-right: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        p.subtitle { font-size: 12px; color: #a0a5b5; margin-bottom: 18px; line-height: 1.4; }
        
        .form-group { text-align: right; margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #b9bbbe; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #0d0e12;
            border: 1px solid #282b38;
            border-radius: 8px;
            font-size: 12px;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        input::placeholder { color: #5c6073; }
        input:focus {
            border-color: #5865F2;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.5);
            outline: none;
            background-color: #12141c;
        }
        
        button#verifyBtn {
            width: 100%;
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        button#verifyBtn:hover { background-color: #4752C4; box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4); }
        button#verifyBtn:active { transform: scale(0.98); }
        button#verifyBtn:disabled { background-color: #3b3e4f; color: #72767d; cursor: not-allowed; }

        .progress-box {
            display: none;
            margin-top: 12px;
            background: #0d0e12;
            border: 1px solid #282b38;
            border-radius: 6px;
            padding: 4px;
            overflow: hidden;
        }
        .progress-bar {
            height: 6px;
            width: 0%;
            background: linear-gradient(90deg, #5865F2, #57d980);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        #result {
            margin-top: 14px;
            font-size: 12px;
            font-weight: bold;
            padding: 9px;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }
        .success { background-color: #132e1b; color: #57d980; border: 1px solid #1e4a2b; }
        .error { background-color: #381a1d; color: #ff6b72; border: 1px solid #57272c; }
        .loading { background-color: #252836; color: #b9bbbe; border: 1px solid #34384a; }

        .footer-ticker {
            margin-top: 15px;
            border-top: 1px solid #202330;
            padding-top: 8px;
            font-size: 10px;
            color: #6c7086;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background: #12141c;
            border: 1px solid #282b3c;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            text-align: right;
            font-size: 12px;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
        }
        .modal-content h3 { color: #57d980; margin-bottom: 10px; font-size: 14px; }
        .modal-content p { color: #a0a5b5; margin-bottom: 6px; line-height: 1.4; direction: ltr; text-align: right; }
        .modal-close {
            margin-top: 15px;
            width: 100%;
            background: #282b38;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="cyber-canvas"></canvas>

    <div class="container">
        <div class="content">
            <div class="status-bar">
                <span class="server-status"><span class="pulse-dot"></span> متصل بالسحاب (Ngrok)</span>
                <button class="scan-btn" onclick="openSecurityScan()">🔍 فحص الجلسة</button>
            </div>

            <div class="lock-icon-box">🔐</div>
            
            <div class="title-wrapper">
                <h2><span id="typedTitle"></span><span class="typing-cursor"></span></h2>
            </div>
            <p class="subtitle">الرجاء إدخال البيانات الأكاديمية للحصول على الرتبة المعتمدة في السيرفر.</p>
            
            <div class="form-group">
                <label>الاسم الكامل (ثلاثي على الأقل):</label>
                <input type="text" id="fullName" placeholder="مثال: هشام عايد الشريف">
            </div>

            <div class="form-group">
                <label>الرقم الأكاديمي (9 أرقام):</label>
                <input type="text" id="studentId" maxlength="9" placeholder="مثال: 442100000">
            </div>

            <div class="form-group">
                <label>اسم المادة / الشعبة:</label>
                <input type="text" id="courseName" placeholder="مثال: أمن الشبكات المتقدم">
            </div>

            <div class="form-group">
                <label>معرف ديسكورد (Discord ID):</label>
                <input type="text" id="discordId" placeholder="مثال: 762964253354622976">
            </div>

            <button id="verifyBtn" onclick="verifyStudent()">توثيق الحساب الآن</button>

            <div class="progress-box" id="progressBox">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div id="result"></div>

            <div class="footer-ticker">
                بوابة مجتمع الحاسب الرسميّة © 2026
            </div>
        </div>
    </div>

    <!-- نافذة فحص الأمان -->
    <div class="modal" id="securityModal">
        <div class="modal-content">
            <h3>🛡️ تقرير فحص أمان الجلسة</h3>
            <p id="clientSystem">💻 نظام التشغيل: جاري الفحص...</p>
            <p id="clientBrowser">🌐 المتصفح: جاري الفحص...</p>
            <p>🔒 تشفير الاتصال: TLS 1.3 / AES-256-GCM</p>
            <p>✅ حالة الجلسة: آمنة ومحمية من التجسس</p>
            <button class="modal-close" onclick="closeSecurityScan()">إغلاق التقرير</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('verified_student') === 'true') {
                window.location.href = 'success.html';
            }
            typeWriter();
        });

        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const networkChars = '01010101101 TCP/IP SSL/TLS ENCRYPTED PORT_3000 AES_256 CYBER_SEC FIREWALL SSH SYSTEM_VERIFY NETWORK_AUTH'.split(' ');
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawCyberRain() {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#5865F2';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = networkChars[Math.floor(Math.random() * networkChars.length)];
                ctx.fillText(text, i * fontSize * 3.5, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawCyberRain, 50);

        const titleText = "بوابة مجتمع الحاسب";
        let titleIndex = 0;
        function typeWriter() {
            if (titleIndex < titleText.length) {
                document.getElementById("typedTitle").innerText += titleText.charAt(titleIndex);
                titleIndex++;
                setTimeout(typeWriter, 90);
            }
        }

        function openSecurityScan() {
            const ua = navigator.userAgent;
            let os = "نظام تشغيل عام";
            if (ua.indexOf("Win") != -1) os = "ويندوز (Windows OS)";
            else if (ua.indexOf("Mac") != -1) os = "ماك (macOS)";
            else if (ua.indexOf("Android") != -1) os = "أندرويد (Android OS)";
            else if (ua.indexOf("iPhone") != -1 || ua.indexOf("iPad") != -1) os = "آي أو إس (iOS)";
            else if (ua.indexOf("Linux") != -1) os = "لينكس (Linux)";

            let browser = "متصفح آمن";
            if (ua.indexOf("Brave") != -1) browser = "بريف (Brave Browser)";
            else if (ua.indexOf("Edg") != -1) browser = "مايكروسوفت إيدج (Microsoft Edge)";
            else if (ua.indexOf("Firefox") != -1) browser = "موزيلا فايرفوكس (Mozilla Firefox)";
            else if (ua.indexOf("OPR") != -1 || ua.indexOf("Opera") != -1) browser = "أوبرا (Opera)";
            else if (ua.indexOf("Safari") != -1 && ua.indexOf("Chrome") == -1) browser = "أبل سفاري (Apple Safari)";
            else if (ua.indexOf("Chrome") != -1) browser = "جوجل كروم (Google Chrome)";

            document.getElementById('clientSystem').innerText = "💻 نظام التشغيل: " + os;
            document.getElementById('clientBrowser').innerText = "🌐 المتصفح: " + browser;
            document.getElementById('securityModal').style.display = 'flex';
        }

        function closeSecurityScan() {
            document.getElementById('securityModal').style.display = 'none';
        }

        let startTimeTracking = 0;

        async function verifyStudent() {
            const fullName = document.getElementById('fullName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const courseName = document.getElementById('courseName').value.trim();
            const discordId = document.getElementById('discordId').value.trim();
            const resultDiv = document.getElementById('result');
            const verifyBtn = document.getElementById('verifyBtn');
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');

            if (!fullName || !studentId || !courseName || !discordId) {
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '❌ الرجاء تعبئة جميع البيانات المطلوبة!';
                return;
            }

            const nameWords = fullName.split(/\s+/).filter(word => word.length > 0);
            if (nameWords.length < 3) {
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '❌ يرجى إدخال الاسم الثلاثي كاملاً!';
                return;
            }

            const studentIdRegex = /^\d{9}$/;
            if (!studentIdRegex.test(studentId)) {
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '❌ الرقم الأكاديمي يجب أن يتكون من 9 أرقام فقط!';
                return;
            }

            if (isNaN(discordId) || discordId.length < 15) {
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '❌ معرف ديسكورد غير صحيح (أرقام فقط)!';
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = 'جاري التحقق الأمني...';
            resultDiv.className = 'loading';
            resultDiv.style.display = 'block';
            
            progressBox.style.display = 'block';
            progressBar.style.width = '0%';
            startTimeTracking = Date.now();

            let currentProgress = 0;
            const totalDuration = 8000;
            const intervalTime = 80;
            const increment = 100 / (totalDuration / intervalTime);

            const progressInterval = setInterval(() => {
                currentProgress += increment;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                }

                const percent = Math.floor(currentProgress);
                progressBar.style.width = percent + '%';

                if (percent < 25) {
                    resultDiv.innerHTML = `⏳ [فحص أمني] جاري توليد مفاتيح التشفير وفحص البيانات... (${percent}%)`;
                } else if (percent < 50) {
                    resultDiv.innerHTML = `⏳ [اتصال السحاب] جاري إرسال الباكتات عبر Ngrok... (${percent}%)`;
                } else if (percent < 75) {
                    resultDiv.innerHTML = `⏳ [قاعدة البيانات] جاري مطابقة السجل الأكاديمي والتحقق منه... (${percent}%)`;
                } else {
                    resultDiv.innerHTML = `⏳ [المصادقة النهائية] جاري منح الصلاحيات وتوثيق ديسكورد... (${percent}%)`;
                }
            }, intervalTime);

            try {
                // تم ربط الرابط السحابي الجديد الخاص بك بـ Ngrok هنا بنجاح
                const response = await fetch('https://uphill-faceted-bloomers.ngrok-free.dev/verify-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, studentId, courseName, discordId })
                });

                const data = await response.json();

                setTimeout(() => {
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';

                    if (response.ok && data.success) {
                        resultDiv.className = 'success';
                        resultDiv.innerHTML = '✅ تم التحقق بنجاح 100% - جاري التحويل لصفحة النجاح...';
                        
                        localStorage.setItem('verified_student', 'true');
                        
                        setTimeout(() => {
                            window.location.href = 'success.html';
                        }, 1000);
                    } else {
                        resultDiv.className = 'error';
                        resultDiv.innerHTML = '❌ ' + (data.message || 'حدث خطأ أثناء التوثيق.') + 
                            '<br><a href="https://discord.gg/dhuwFxJbWt" target="_blank" style="display:inline-block; margin-top:8px; color:#5865F2; font-weight:bold; text-decoration:underline;">🎫 تواجه مشكلة؟ اضغط هنا لفتح تكت دعم فني</a>';
                        
                        verifyBtn.disabled = false;
                        verifyBtn.innerText = 'توثيق الحساب الآن';
                        progressBox.style.display = 'none';
                        progressBar.style.width = '0%';
                    }
                }, Math.max(0, totalDuration - (Date.now() - startTimeTracking)));

            } catch (error) {
                clearInterval(progressInterval);
                setTimeout(() => {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '❌ فشل الاتصال بالسيرفر، تأكد من تشغيل أداة Ngrok والسيرفر المحلي.' + 
                        '<br><a href="https://discord.gg/dhuwFxJbWt" target="_blank" style="display:inline-block; margin-top:8px; color:#5865F2; font-weight:bold; text-decoration:underline;">🎫 تواجه مشكلة؟ اضغط هنا لفتح تكت دعم فني</a>';
                    
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = 'توثيق الحساب الآن';
                    progressBox.style.display = 'none';
                    progressBar.style.width = '0%';
                }, 1000);
            }
        }
    </script>

</body>
</html>
